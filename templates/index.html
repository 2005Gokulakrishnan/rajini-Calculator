<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajini++ Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="calculator">
    <header>
      <div class="brand-mark">R<span>++</span></div>
      <div>
        <p class="eyebrow">SUPERSTAR EDITION</p>
        <h1>Rajini++ Calculator</h1>
      </div>
    </header>

    <section class="screen" aria-live="polite">
      <div class="expression" id="expression">Ready for the next move</div>
      <div class="display" id="display">0</div>
      <div class="engine" id="engine">POWERED BY RAJINI++</div>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">DEL</button>
      <button class="operator" data-operator="%">%</button>
      <button class="operator" data-operator="/">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button class="operator" data-operator="*">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button class="operator" data-operator="-">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button class="operator" data-operator="+">+</button>

      <button class="zero" data-number="0">0</button>
      <button data-action="decimal">.</button>
      <button class="equals" data-action="equals">=</button>
    </section>
    <p class="footnote">A little style. A lot of calculation. Magizhchi!</p>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
